<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">
  <title>Learning Journey</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>

    :root {
      --green-primary: #036937;
      --green-light: #28915A;
      --green-lighter: #5AB98C;
      --green-dark: #024B28;
      --green-darker: #01321C;
      --green-tint: #D2EBDE;

      --green-main-background: #F8FAF9;
      --green-card-background: #FFFFFF;
      --green-subtle-section: #EEF3F0;
      --green-primary-text: #0F172A;
      --green-secondary-text: #475569;
      --green-muted-text: #64748B;

      --purple-primary: #553278;
      --purple-light: #73509B;
      --purple-lighter: #A587C3;
      --purple-dark: #41265C;
      --purple-darker: #301C46;
      --purple-tint: #E6DEF0;

      --purple-main-background: #FAF9FC;
      --purple-card-background: #FFFFFF;
      --purple-subtle-section: #F1EEF6;
      --purple-primary-text: #111827;
      --purple-secondary-text: #4B5563;
      --purple-muted-text: #6B7280;
    }

    body {
      background-color: var(--green-main-background);
    }


    #year-buttons {
      display: flex;
      justify-content: center;
      margin-bottom: 2em;
    }

    #year-buttons button {
      border: none;
      color: black;
      padding: 16px 32px;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      font-size: 16px;
      margin: 4px 2px;
      cursor: pointer;
    }

    #year-buttons button:hover {
      background-color: black;
      color: white;
    }


    #outer-container {
      width: 400px;
      margin: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
/*      border: 1px solid red;  */
    }

    #buttons-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
/*      border: 1px solid green;  */
    }

    #buttons-container h2 {
      font-family: sans-serif;
      font-size: 55px;
      color: var(--green-light);
    }

    #ks4-qualification-button-block {
      display: flex;
      justify-content: center;
      width: 380px;
      height: min-content;
      margin-bottom: 1em;
      background-color: var(--green-primary);
      box-shadow: 0px 7px 7px rgba(0, 0, 0, 0.3);
    }

    #ks3-button-block,
    #ks4-gcse-button-block,
    #ks4-btec-button-block,
    #ks4-cambnat-button-block {
      flex-wrap: wrap;
      justify-content: center;
      width: 380px;
      height: min-content;
      background-color: var(--green-primary);
      box-shadow: 0px 7px 7px rgba(0, 0, 0, 0.3);
      margin-bottom: 1em;
    }

    #ks3-button-block {
      display: flex;
    }

    #ks4-gcse-button-block {
      display: none;
    }

    #ks4-btec-button-block {
      display: none;
    }

    #ks4-cambnat-button-block {
      display: none;
    }

    /* reset WordPress button styling */

    .ks4-qualification-btn {
      all: unset;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      cursor: pointer;
    }

    .ks3-subject-btn,
    .ks4-gcse-subject-btn,
    .ks4-btec-subject-btn,
    .ks4-cambnat-subject-btn {
      all: unset;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      cursor: pointer;
    }

    /* ------------------------------ */

    .ks4-qualification-btn {
      background-color: var(--green-primary);
      color: var(--green-tint);
      margin: 2px;
      border-radius: 4px;
      text-align: center;
      text-decoration: none;
      font-family: sans-serif;
      font-size: 16px;
      padding: 3px 8px;
    }

    .ks4-qualification-btn:hover {
      color: white;
    }

    .ks4-qualification-btn:active {
      color: white;
    }

    .ks3-subject-btn,
    .ks4-gcse-subject-btn,
    .ks4-btec-subject-btn,
    .ks4-cambnat-subject-btn {
      background-color: var(--green-primary);
      color: var(--green-tint);
      margin: 2px;
      border-radius: 4px;
      text-align: center;
      text-decoration: none;
      font-family: sans-serif;
      font-size: 14px;
      padding: 3px 8px;
    }

    .ks3-subject-btn:hover,
    .ks4-gcse-subject-btn:hover,
    .ks4-btec-subject-btn:hover,
    .ks4-cambnat-subject-btn:hover {
      color: white;
    }

    .ks3-subject-btn:active,
    .ks4-gcse-subject-btn:active,
    .ks4-btec-subject-btn:active,
    .ks4-cambnat-subject-btn:active {
      color: white;
    }

    .current-btn {
      background-color: var(--green-lighter);
      color: white;
    }

    /* visibility of cards */
    .panel { display: none; }
    .panel.active { display: block; }


    /* learning journey card */

    .learning-journey-green {
      position: relative;
      width: 336px;
      height: 480px;
      padding: 8px;
      border-radius: 8px;
      background-color: var(--green-primary);
      box-shadow: 0px 7px 7px rgba(0, 0, 0, 0.3);
    }

    .top-section {
      width: 100%;
      height: 15%;
    }

    .top-section h3 {
      font-family: sans-serif;
      font-size: 24px;
      color: var(--green-tint);
      margin: 0;
    }

    .subject {
      display: flex;
      justify-content: space-between;
      align-items: center;    
      font-family: sans-serif;
      color: var(--green-card-background);
    }

    .subject h4 {
      font-size: 16px;
    }

    .subject h5 {
      font-size: 8px;
    }

    .term-section {
      position: relative;
      width: 100%;
      height: 28%;
      background-color: var(--green-card-background);
    }

    .term-section svg {
      position: absolute;
      left: 0px;
      top: 10px;
      width: 100%;
      height: auto;
    }

    .term-section h5 {
      position: absolute;
      left: 145px;
      top: 38px;
      font-family: sans-serif;
      font-size: 10px;
      color: var(--green-light);
    }

    .term-list {
      position: absolute;
      left: 40px;
      height: 50px;
      width: 270px;
      display: flex;
      justify-content: space-evenly;
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .first-half {
      top: 5px;
      flex-direction: row-reverse;
    }

    .second-half {
      top: 65px;
    }

    .textbox {
      font-family: sans-serif;
      color: var(--green-primary-text);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 5px;
      background-color: var(--green-card-background);
      border: 2px solid var(--green-light);
      border-radius: 8px;
      font-size: 7px;
    }

    .textbox span {
      display: block;
    }

    .textbox:hover {
      transform: scale(1.5);
    }


    @media (min-width: 640px) {

      #outer-container { width: 640px;}

      .learning-journey-green {
        width: 500px;
        height: 700px;
        padding: 10px;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      }

      .learning-journey-green h3 { font-size: 36px; }

      .top-section h3 { font-size: 36px; }

      .subject h4 { font-size: 24px; }

      .subject h5 { font-size: 12px; }

      .term-section h5 {
        left: 220px;
        top: 52px;
        font-size: 15px;
      }

      .term-list {
        left: 60px;
        height: 70px;
        width: 400px;
      }

      .first-half {
        top: 5px;
        flex-direction: row-reverse;
      }

      .second-half {
        top: 95px;
      }

      .textbox {
        border: 2px solid var(--green-light);
        border-radius: 8px;
        font-size: 12px;
      }

      .textbox:hover {
        transform: none;
      }

    }

    @media (min-width: 960px) {

      #outer-container {
        width: 960px;
        flex-direction: row;
        align-items: flex-start;
      }

    }

    .screenreader-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

  </style>

</head>

<body>

  <div id="year-buttons">
    <button type="button" id="y7-btn">Year 7</button>
    <button type="button" id="y8-btn">Year 8</button>
    <button type="button" id="y9-btn">Year 9</button>
    <button type="button" id="y10-btn">Year 10</button>
    <button type="button" id="y11-btn">Year 11</button>
  </div>

  <div id="outer-container">

    <div id="buttons-container">

      <!-- title root  -->
      <div id="title-container"></div>


      <!-- ks3 buttons root -->
      <div id="ks3-button-block" aria-label="Select a Key Stage 3 subject"></div>

      <!-- ks4 qualification buttons root -->
      <div id="ks4-qualification-button-block" aria-label="Select a Key Stage 4 qualification"></div>

      <!-- ks4 gcse buttons root -->
      <div id="ks4-gcse-button-block" aria-label="Select a GCSE subject"></div>

      <!-- ks4 btec buttons root -->
      <div id="ks4-btec-button-block" aria-label="Select a BTEC subject"></div>

      <!-- ks4 cambnat buttons root -->
      <div id="ks4-cambnat-button-block" aria-label="Select a Cambridge National subject"></div>

    </div>


    <!-- learning journey goes here -->
    <div id="learning-journey-root"></div>

  </div>


  <script type = "module">

    import { renderYear } from "./learningjourney.js";

    document.getElementById("y7-btn").addEventListener("click", () => {renderYear(7);});
    document.getElementById("y8-btn").addEventListener("click", () => {renderYear(8);});
    document.getElementById("y9-btn").addEventListener("click", () => {renderYear(9);});
    document.getElementById("y10-btn").addEventListener("click", () => {renderYear(10);});
    document.getElementById("y11-btn").addEventListener("click", () => {renderYear(11);});

    document.addEventListener("DOMContentLoaded", () => {renderYear(7);});

  </script>

</body>
